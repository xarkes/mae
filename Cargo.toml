[package]
name = "mae"
version = "0.0.1"
edition = "2024"

[features]
default = ["opengl"]
opengl = ["dep:gl"]

[dependencies]
fontdue = "0.9.3"
gl = { version = "*", optional = true }
notify = { version = "8.0.0", optional = false }
roxmltree = { version = "0.20.0", optional = false }

[target.'cfg(target_os="linux")'.dependencies]
x11 = { version = "2.21.0", features = ["xlib", "glx"] }

[target.'cfg(target_os="macos")'.dependencies]
objc2 = "*"
objc2-app-kit = "*"
objc2-foundation = "*"

[target.'cfg(target_os="windows")'.dependencies.windows]
version = "*"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_OpenGL", # TODO: Make this optional later
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging"
]

[profile.release]
lto = true
strip = true
# codegen-units = 1 # TODO: To 1 to reduce binary size, but maybe just increases compilation time for no gain
panic = "abort" # TODO: Maybe we don't want this in release mode

