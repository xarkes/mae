[package]
name = "mae"
version = "0.0.1"
edition = "2024"

[features]
default = ["opengl", "cpu", "freetype"]
opengl = ["dep:gl"]
fontdue = ["dep:fontdue", "dep:lru"]
freetype = ["dep:freetype-rs"]
cpu = []
testkit = []

[dependencies]
fontdue = { version = "0.9.3", optional = true }
gl = { version = "*", optional = true }
lru = { version = "0.16", optional = true }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
freetype-rs = { version = "0.38", optional = true }

[target.'cfg(target_os="linux")'.dependencies]
x11 = { version = "2.21.0", features = ["xlib", "glx"] }

[target.'cfg(target_os="macos")'.dependencies]
objc2 = "*"
objc2-app-kit = "*"
objc2-foundation = "*"

[target.'cfg(target_os="windows")'.dependencies.windows]
version = "*"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_OpenGL",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
strip = true
panic = "abort"
